<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dinosaur Game</title>
<style>
  /* Ebitengine sizes its canvas from <body>, so the body *is* the game area.
     Give it a fixed size instead of the whole viewport: the 128x64 screen at
     4x (512x256) fits a laptop window with room to spare. Shrink to fit
     narrow (100vw) or short (200vh, the 2:1 aspect) viewports.

     The 512px ceiling is a web-only choice: here the canvas has to share a
     page. The desktop build owns its window and picks a larger scale of its
     own (cmd/dinosaur-game/main.go).

     The script at the end of the body trims this width down to a whole number
     of device pixels per game pixel; this rule is what runs without it. */
  html {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f7f7;
    overflow: hidden;
  }
  body {
    margin: 0;
    width: min(512px, 100vw, 200vh);
    aspect-ratio: 2 / 1;
    /* Ebitengine sets height:100% inline on the body; !important wins. */
    height: auto !important;
  }
  canvas {
    /* Ebitengine keeps the canvas backing store on the device pixel grid, so
       there is normally nothing here to resample. This only bites if the two
       drift apart for a frame, e.g. mid-zoom before Ebitengine resizes it. */
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<script>
  // Ebitengine blits the 128x64 offscreen to the canvas at whatever ratio the
  // body allows. Only a whole-number ratio is a plain pixel copy; at a
  // fractional one it falls back to an antialiased filter and the game pixels
  // stop being the same size. Measured in Chromium at a 390px viewport, where
  // the rule above yields 3.05x: the 1px sprite and 3x5 font strokes came out
  // as a mix of 3px and 4px runs, with 2.7% of the canvas at a blended grey.
  // At 4x it is two colours and every run a multiple of 4. So give the body a
  // whole multiple of the screen size, measured in device pixels.
  //
  // Ebitengine reads body.clientWidth, which is CSS pixels rounded to a whole
  // number, so this lands exactly when devicePixelRatio is an integer -- the
  // usual case on phones and at default desktop zoom. At a fractional ratio
  // the width can end up a device pixel short of the multiple, close enough
  // that the filter has almost nothing left to blend.
  const fit = () => {
    const dpr = window.devicePixelRatio;
    const limit = Math.min(512, innerWidth, 2 * innerHeight) * dpr;
    const scale = Math.max(1, Math.floor(limit / 128));
    document.body.style.width = Math.floor((128 * scale) / dpr) + "px";
  };
  fit();
  addEventListener("resize", fit);
</script>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject)
    .then((result) => go.run(result.instance));
</script>
</body>
</html>
