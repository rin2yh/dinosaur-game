<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dinosaur Game</title>
<style>
  /* Ebitengine sizes its canvas from <body>, so the body *is* the game area.
     512x256 is the 128x64 screen at 4x, which fits a laptop window with room
     to spare; shrink for narrow (100vw) or short (200vh, the 2:1 aspect)
     viewports. The ceiling is lower than the desktop build's because the
     canvas shares a page here. The script below trims this width further;
     this rule is what runs without it. */
  html {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f7f7;
    overflow: hidden;
  }
  body {
    margin: 0;
    width: min(512px, 100vw, 200vh);
    aspect-ratio: 2 / 1;
    /* Ebitengine sets height:100% inline on the body; !important wins. */
    height: auto !important;
  }
  canvas {
    /* Ebitengine keeps the backing store on the device pixel grid, so this
       only bites if the two drift for a frame, e.g. mid-zoom. */
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<script>
  // Ebitengine copies the 128x64 offscreen pixel for pixel only at a
  // whole-number ratio; otherwise it filters, and game pixels stop being the
  // same size (measured at a 390px viewport, where the rule above gives
  // 3.05x: 1px strokes came out as a mix of 3px and 4px). So round the body
  // to a whole multiple of the screen, in device pixels.
  //
  // Exact whenever devicePixelRatio is an integer. Ebitengine reads
  // body.clientWidth, which is whole CSS pixels, so a fractional ratio can
  // land a device pixel short -- close enough to leave nothing to blend.
  const fit = () => {
    const dpr = window.devicePixelRatio;
    const limit = Math.min(512, innerWidth, 2 * innerHeight) * dpr;
    const scale = Math.max(1, Math.floor(limit / 128));
    document.body.style.width = Math.floor((128 * scale) / dpr) + "px";
  };
  fit();
  addEventListener("resize", fit);
</script>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject)
    .then((result) => go.run(result.instance));
</script>
</body>
</html>
