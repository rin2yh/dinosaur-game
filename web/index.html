<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dinosaur Game</title>
<style>
  /* Ebitengine sizes its canvas from <body>, so the body *is* the game area.
     512px caps the 128x64 screen at 4x, lower than the desktop build's
     ceiling because this canvas shares a page. Anything short of a whole
     multiple of 128 becomes letterboxing inside the canvas: the Go side
     rounds the scale down and fills the rest with the background below. */
  html {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f7f7;
    overflow: hidden;
  }
  body {
    margin: 0;
    width: min(512px, 100vw, 200vh);
    aspect-ratio: 2 / 1;
    /* Ebitengine sets height:100% inline on the body; !important wins. */
    height: auto !important;
  }
  canvas {
    /* Near-inert: Ebitengine keeps the backing store on the device pixel
       grid. This only bites mid-zoom, before it catches up. */
    image-rendering: pixelated;
    /* The backing store is truncated to whole device pixels, so a
       fractional devicePixelRatio can leave the element a half pixel
       taller than what it has to draw. Painting that sliver keeps it from
       coming out as a grey hairline along the edge. */
    background: #f7f7f7;
  }
</style>
</head>
<body>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject)
    .then((result) => go.run(result.instance));
</script>
</body>
</html>
