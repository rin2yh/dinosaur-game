<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dinosaur Game</title>
<style>
  /* Ebitengine sizes its canvas from <body>, so the body *is* the game area.
     Give it a fixed size instead of the whole viewport: the 128x64 screen at
     4x (512x256) fits a laptop window with room to spare, and an integer
     scale is what keeps the pixelated rendering below from drawing some game
     pixels wider than others. Shrink to fit narrow (100vw) or short (200vh,
     the 2:1 aspect) viewports. */
  html {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    /* No background here: main.go sets it on this element from the same
       palette it clears the canvas with, so the border around the canvas
       follows the game into night mode. Until the WASM is up the page is
       empty anyway, canvas included, so there is nothing to mismatch. */
    overflow: hidden;
  }
  body {
    margin: 0;
    width: min(512px, 100vw, 200vh);
    aspect-ratio: 2 / 1;
    /* Ebitengine sets height:100% inline on the body; !important wins. */
    height: auto !important;
  }
  canvas {
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject)
    .then((result) => go.run(result.instance));
</script>
</body>
</html>
